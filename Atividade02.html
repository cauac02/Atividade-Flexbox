
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Atividade 2 - Porsche Trips</title>
    <link rel="stylesheet" href="Atividade02.css">
</head>
<body>

    <!-- Cabeçalho / Navbar -->
    <header class="header">
        <div class="logo">Porsche Trips</div>

        <nav class="menu">
            <a href="#">Home</a>
            <a href="#">Modelos</a>
            <a href="#">Contato</a>
        </nav>
    </header>

    <!-- Container Principal das Imagens -->
    <main class="gallery-container">

        <!-- Imagem Grande Principal -->
        <div class="main-card">
            <img src="https://i.pinimg.com/564x/1e/9b/50/1e9b504a29a3ab5a18160ab6ad88d254.jpg" alt="Porsche em destaque">
            <p class="legenda">Porsche — potência e elegância</p>
        </div>

        <!-- Grade com as 4 Imagens Menores -->
        <div class="small-cards-grid">

            <div class="card">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ2VeYBFfCPe5_kmqUwV1W104PCIJYD2H6dbpJAVNy2Tw&s=10" alt="Carro Porsche">
                <p class="legenda">Porsche esportivo</p>
            </div>

            <div class="card">
                <img src="https://cdn.motor1.com/images/mgl/G3Zx6E/s1/porsche-cayenne-2023.jpg" alt="Porsche Cayenne">
                <p class="legenda">Porsche Cayenne</p>
            </div>

            <div class="card">
                <img src="https://conteudo.imguol.com.br/c/colunas/01/2021/05/13/porsche-911-carrera-s-cabriolet-1620942062718_v2_1x1.jpg" alt="Porsche 911 Carrera">
                <p class="legenda">Porsche 911 Carrera</p>
            </div>

            <div class="card">
                <img src="https://rsvpperfil.com.br/wp-content/uploads/2025/06/Ferragamo-1.jpg" alt="Estilo e luxo automotivo">
                <p class="legenda">Estilo e sofisticação</p>
            </div>

        </div>

    </main>

    <!-- Rodapé -->
    <footer class="footer">
        Porsche Trips - Paixão por carros esportivos
    </footer>

</body>
</html>
