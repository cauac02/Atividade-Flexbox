
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Site-EXEMPLO1</title>

    <style>
        .container {
            display: flex;
            flex-flow: row-reverse;
            flex-wrap: wrap;
            align-content: center;
            flex-grow: 20;
            justify-content: space-between;
        }

        .item {
            background-color: rgb(27, 176, 181);
            margin: 10px;
            border: 1px solid rgb(0, 0, 0);
            color: aliceblue;
            font-size: 20px;
            width: 150px;
            height: 150px;
            order: 3;
        }

        .item2 {
            background-color: chartreuse;
            order: 1;
        }

        .item5 {
            background-color: rgb(188, 149, 33);
            order: 2;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="item">1</div>
        <div class="item item2">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item item5">5</div>
    </div>

</body>
</html>
